<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pintech | Technology & AI Services</title>

  <meta
    name="description"
    content="Pintech develops technology, artificial intelligence, and engineering projects."
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #071a12;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 800px;
    }

    .brand {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #9ee37d;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 80px);
      margin-bottom: 20px;
    }

    h1 span {
      color: #b8f26d;
    }

    p {
      color: #b8c7be;
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      background: #b8f26d;
      color: #071a12;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    footer {
      margin-top: 60px;
      font-size: 13px;
      color: #607369;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">PINTECH</div>

    <h1>
      Building Technology<br />
      <span>with Intelligence.</span>
    </h1>

    <p>
      Exploring artificial intelligence, engineering and intelligent
      systems through practical technology projects.
    </p>

    <a href="/ezDurian" class="button">
      Explore ezDurian →
    </a>

    <footer>
      © 2026 Pintech. All rights reserved.
    </footer>

  </main>

</body>
</html>
